[package]
name = "tlint"
version = "0.9.5"
edition = "2024"

[lib]
name = "tlint"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
colored = "3.1.1"
jsonschema = { version= "0.49.2", default-features = false }
rhai = { version = "1.25.1", features = ["internals"] }
serde = {version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
serde_json = "1.0.151"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lychee-lib = "0.24.2"
smol = "2.0.2"
async-compat = "0.2.5"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
