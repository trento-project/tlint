[package]
name = "tlint-wasm"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
# Optimize wasm size
lto = true          # turn on Link-Time Optimizations
codegen-units = 1   # trade compile time with maximum optimization
opt-level = "s"     # optimize for size

[dependencies]
tlint = { path = "../" }
rhai = { version = "1.25.1", features = ["only_i32", "internals", "wasm-bindgen"] }
serde = {version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
serde_json = "1.0.151"
wasm-bindgen = { version = "0.2.126", features = ["serde-serialize"] }
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = "0.1.7"

# Transitive dependencies (via ahash/jsonschema/rhai) pull in both getrandom
# major versions; each needs its own wasm backend enabled explicitly, since
# the wasm32-unknown-unknown target doesn't have a default randomness source.
# These lines can't be removed: getrandom 0.2/0.3 get pulled in either way
# (via ahash/jsonschema/rhai), so without this, the build fails with
# "the wasm*-unknown-unknown targets are not supported by default".
#
# We're pinned to these two majors, not crates.io's latest (0.4.x): we don't
# call getrandom ourselves, we only exist here to attach a feature flag to
# whatever version ahash/jsonschema/rhai already require internally. Bumping
# this to 0.4 wouldn't upgrade anything - those crates haven't migrated to it
# yet - it would just add a third, unused getrandom version while leaving the
# actually-used 0.2/0.3 ones without their wasm feature again.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
